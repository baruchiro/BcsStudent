name: Analytics tests

on:
  pull_request:
    paths:
      - 'src/analytics/**'
      - 'scripts/test-analytics.mjs'
      - '.github/workflows/analytics-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-analytics.mjs
