name: Analytics regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/test-analytics*.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/analytics.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/test-analytics*.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/analytics.yml'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_POSTHOG_KEY: public-local-test-key
      NEXT_TELEMETRY_DISABLED: '1'
      ANALYTICS_TEST_URL: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root development dependencies
        run: node .yarn/releases/yarn-3.6.1.cjs install --immutable --mode=skip-build
      - name: Install browser
        run: node .yarn/releases/yarn-3.6.1.cjs playwright install --with-deps chromium
      - name: Core and browser regressions
        run: node .yarn/releases/yarn-3.6.1.cjs test:analytics
      - name: Build with synthetic analytics key
        run: INIT_CWD=$PWD node node_modules/next/dist/bin/next build
      - name: Built-site and real SDK regressions (external browser requests blocked)
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 -p 4318 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4318/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4318/ > /dev/null
          node .yarn/releases/yarn-3.6.1.cjs test:analytics:site
